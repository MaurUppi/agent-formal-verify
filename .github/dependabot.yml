version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    # Dependabot refuses npm pull requests that change files under .github/
    # (dependabot/dependabot-core#15721).
    directory: /tests/skills-cli
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
